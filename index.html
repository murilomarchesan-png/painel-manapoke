<title>Resultados do Mana Poke</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
:root{--bg:#faf6f1;--card:#fff;--fg:#201a1b;--mut:#6b5f61;--ln:#ece1d8;--az:#e02a4d;--azbg:#ffe6ec;--ok:#1d7a0d;--okbg:#e4f4de;--am:#8a4a0a;--ambg:#fdf0d2;--rp:#b42318;--rpbg:#fde8e6;--soft:#fbf2ea;--on:#fff;--side:#12281a;--sidefg:#d6e8da;--sh:0 1px 2px rgba(32,26,27,.06),0 6px 18px rgba(32,26,27,.05);--c1:#ff3358;--c2:#2b9a13;--c3:#32ab17;--c4:#d97706;--c5:#6d28d9;--c6:#7a6e70}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#17231c;--fg:#f0ece8;--mut:#a9b8ae;--ln:#2b3c31;--az:#ff6b85;--azbg:#3d1620;--ok:#6fd35a;--okbg:#14301a;--am:#f2b45a;--ambg:#3a2a0d;--rp:#ff9086;--rpbg:#3d1714;--soft:#1b2a21;--on:#1a0a0e;--side:#0a120d;--sidefg:#c9dccd;--sh:0 1px 2px rgba(0,0,0,.4);--c1:#ff6b85;--c2:#6fd35a;--c3:#5fd04a;--c4:#f2b45a;--c5:#b69bff;--c6:#b6aaac;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17231c;--fg:#f0ece8;--mut:#a9b8ae;--ln:#2b3c31;--az:#ff6b85;--azbg:#3d1620;--ok:#6fd35a;--okbg:#14301a;--am:#f2b45a;--ambg:#3a2a0d;--rp:#ff9086;--rpbg:#3d1714;--soft:#1b2a21;--on:#1a0a0e;--side:#0a120d;--sidefg:#c9dccd;--sh:0 1px 2px rgba(0,0,0,.4);--c1:#ff6b85;--c2:#6fd35a;--c3:#5fd04a;--c4:#f2b45a;--c5:#b69bff;--c6:#b6aaac;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;margin:0}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidefg);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .marca{padding:4px 6px 14px}.logo{display:inline-flex;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:var(--sh)}.logo img{display:block;height:44px;width:auto}.side .marca small{display:block;font:700 10px Inter;letter-spacing:.22em;color:#ffb3c0;margin-top:8px;padding-left:4px}.topo .logo{display:none}.topo .tt{display:flex;align-items:center;gap:12px}
.side h4{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:#8fa0c4;margin:16px 10px 6px}
.side a{display:block;color:var(--sidefg);text-decoration:none;font-weight:600;font-size:14.5px;padding:9px 12px;border-radius:10px;min-height:40px}
.side a:hover{background:rgba(255,255,255,.08)}.side a[aria-current="true"]{background:var(--az);color:#fff}
.side a:focus-visible,.btn:focus-visible,.seg button:focus-visible,summary:focus-visible,.topnav a:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.main{min-width:0;padding-bottom:80px}
.topo{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.topo h1{font-size:20px;line-height:1.2}.topo .ln{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:4px;font-size:13px;color:var(--mut)}
.topo .fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button,.btn{font:600 13.5px Inter,system-ui,sans-serif;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 13px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"],.btn.pri{background:var(--az);border-color:var(--az);color:var(--on)}
.topnav{display:none}
.corpo{padding:18px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));max-width:1180px}
section.painel{display:none}section.painel.on{display:block}
h2{font-size:22px;margin:0 0 2px}.sub{color:var(--mut);font-size:14px;margin:0 0 14px;max-width:78ch}
.nota{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--sh)}.card h3{font-size:16.5px;margin:0 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:13px 15px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .kt{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.kpi .kv{font:800 25px/1.15 "Plus Jakarta Sans",Inter,sans-serif;overflow-wrap:anywhere}
.kpi .kc{font-size:12.5px;font-weight:700}.kc.up{color:var(--ok)}.kc.dn{color:var(--rp)}.kc.nu{color:var(--mut);font-weight:400}
.kpi .kf{font-size:11.5px;color:var(--mut);margin-top:2px}
.est{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-right:6px}
.e-conf{background:var(--okbg);color:var(--ok)}.e-parc{background:var(--ambg);color:var(--am)}.e-estim{background:var(--azbg);color:var(--az)}.e-sem{background:var(--soft);color:var(--mut);border:1px solid var(--ln)}.e-pend{background:var(--rpbg);color:var(--rp)}
.cr{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin:0 0 16px}
.cr{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}.cr .card{margin:0}.mat-top{display:flex;gap:14px;align-items:flex-start}.ret{margin-top:12px;font-size:13px}.ret .barra{height:8px;background:var(--soft);border:1px solid var(--ln);border-radius:99px;overflow:hidden;margin:6px 0}.ret .barra i{display:block;height:100%;background:var(--c1)}.rl{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut)}.mat .tabela{margin-top:10px}
.cr img{width:112px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;border:1px solid var(--ln);flex:none;background:var(--soft)}
.cr .info{min-width:0;flex:1}.cr h3{margin:0 0 4px}
.cr .meta{font-size:13px;color:var(--mut);margin:6px 0;line-height:1.45}.cr .meta b{color:var(--fg)}
.cr details{margin:6px 0}.cr summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--az)}
.cr .txt{white-space:pre-line;font-size:13.5px;line-height:1.5;margin:6px 0 0}
.cr .mini{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin-top:8px;font-size:13px}.cr .mini span{color:var(--mut);display:block;font-size:12px}
@media(max-width:480px){.cr{grid-template-columns:1fr}.cr img{width:92px}}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.graf{position:relative;height:270px}
.tabela{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--card);margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:13.2px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
thead th{background:var(--soft);font-weight:700}
td.tx,th.tx{text-align:left;white-space:normal;min-width:150px}
.aviso{background:var(--ambg);color:var(--am);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px}.aviso.rp{background:var(--rpbg);color:var(--rp)}.aviso.ok{background:var(--okbg);color:var(--ok)}
.lista{list-style:none;padding:0;margin:0}.lista li{padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}.lista li:last-child{border:0}
.sem{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:2px 10px;min-width:74px;text-align:center}
.s-normal{background:var(--okbg);color:var(--ok)}.s-atencao{background:var(--ambg);color:var(--am)}.s-critico{background:var(--rpbg);color:var(--rp)}
.alerta{border:1px solid var(--ln);border-left:6px solid var(--c6);border-radius:14px;padding:12px 15px;margin:0 0 10px;background:var(--card)}
.alerta.a-normal{border-left-color:var(--ok)}.alerta.a-atencao{border-left-color:var(--am)}.alerta.a-critico{border-left-color:var(--rp)}
.alerta .topl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.alerta p{margin:6px 0 0;font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--mut);border:1px solid var(--ln)}
details.dt{border:1px solid var(--ln);border-radius:14px;background:var(--card);padding:10px 16px;margin:0 0 12px}details.dt summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}details.dt p{font-size:14px;color:var(--mut);margin:6px 0}
@media(max-width:900px){.topo .logo{display:inline-flex}.topo .logo img{height:34px}.app{display:block}.side{display:none}.topo{position:static}.topo .ln span:nth-child(n+3){display:none}
.topnav{display:flex;gap:6px;overflow-x:auto;padding:8px max(14px,env(safe-area-inset-left,0px)) 8px;position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--ln)}.topnav a{flex:none;text-decoration:none;font:600 13.5px Inter,sans-serif;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 13px;min-height:40px;display:inline-flex;align-items:center}.topnav a[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.topo{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}.corpo{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}.graf{height:240px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .kv{font-size:21px}}
@media(max-width:400px){.kpis{grid-template-columns:1fr}}
@media(max-width:700px){.tabela{border:0;background:transparent;overflow:visible}.tabela table,.tabela tbody,.tabela tr,.tabela td{display:block;width:100%}.tabela thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabela tr{border:1px solid var(--ln);border-radius:12px;background:var(--card);margin:0 0 10px;overflow:hidden}.tabela td{white-space:normal;text-align:right;display:flex;justify-content:space-between;align-items:baseline;gap:14px;border-bottom:1px solid var(--ln);padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.tabela td:first-child{position:static;display:block;text-align:left;font-weight:700;background:var(--soft)}.tabela td:last-child{border-bottom:0}.tabela td:empty{display:none}
.tabela td[data-l]::before{content:attr(data-l);color:var(--mut);font-size:12.5px;font-weight:600;text-align:left;flex:none;max-width:46%}}
@media(prefers-reduced-motion:no-preference){.card,.kpi{transition:box-shadow .15s}}

function calc(p){
  const T=D.totais, hoje=D.lido_em;

  if(p==='tudo'){
    ads=D.anuncios.map(a=>({...a}));
    camps=D.campanhas.map(c=>({...c}));
    g=T.gasto; al=T.alcance; im=T.impressoes; lk=T.cliques_link; sg=T.seguidores;
    rot=dd(T.inicio)+' a '+dd(T.fim); parcial=T.fim===hoje;
  } else {
    const r=D.diario.find(x=>x.data===p)||{};

    ads=D.anuncios_dia.filter(a=>a.data===p).map(a=>({...a,resultado_tipo:TIPO[a.objetivo]}));
    const grp={};
    ads.forEach(a=>{const o=grp[a.objetivo]=grp[a.objetivo]||{objetivo:a.objetivo,gasto:0,impressoes:0,cliques_link:0,resultados:0,seguidores:0};o.gasto+=a.gasto;o.impressoes+=a.impressoes;o.cliques_link+=a.cliques_link;o.resultados+=a.resultados;o.seguidores+=a.seguidores;});
    camps=D.campanhas.map(c=>{const o=grp[c.objetivo]; if(!o)return null;
      return {campanha:c.campanha,objetivo:c.objetivo,status:c.status,orcamento_diario:c.orcamento_diario,gasto:o.gasto,alcance:null,impressoes:o.impressoes,cliques_link:o.cliques_link,resultado_tipo:TIPO[c.objetivo],resultados:c.objetivo==='Tráfego'?o.resultados:null,seguidores:o.seguidores};}).filter(Boolean);
    rot=dd(p); parcial=p===hoje;

  const tr=ads.filter(a=>a.objetivo==='Tráfego');
  const visitas=sum(tr,'resultados'), gTr=sum(tr,'gasto');

   ${kpi('Novos seguidores',int(C.seg),ps&&ps[0]||'atribuídos aos anúncios',ps&&ps[1])}

function ir(id){secao=id;history.replaceState(null,'','#'+id);
  document.querySelectorAll('section.painel').forEach(s=>s.classList.toggle('on',s.id==='p-'+id));
  document.querySelectorAll('[data-s]').forEach(a=>{if(a.dataset.s===id)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');});
  window.scrollTo(0,0);draw();}
function seg(){
  const d=dias().slice(-3).reverse(); const opts=[['tudo','Tudo']].concat(d.map(x=>[x,(x===D.lido_em?'Hoje ':'')+dd(x)]));
  $('#seg').innerHTML=opts.map(([v,t])=>`<button type="button" data-p="${v}" aria-pressed="${v===periodo}">${t}</button>`).join('');
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{periodo=b.dataset.p;seg();head();draw();});
}
function head(){const C=calc(periodo);$('#hPer').textContent='Período: '+C.rot+(C.parcial?' (parcial)':'');$('#hColeta').textContent='Lido em '+ddy(D.lido_em);$('#hFontes').textContent='Fonte: Meta Ads';}
function draw(){kill();({resumo:rResumo,anuncios:rAnuncios,materiais:rMateriais,publico:rPublico,acessos:rAcessos,dados:rDados})[secao]();}
(function init(){
  const h=location.hash.slice(1); if(SECOES.some(s=>s[0]===h))secao=h;
  nav();seg();head();
  document.querySelectorAll('section.painel').forEach(s=>s.classList.toggle('on',s.id==='p-'+secao));
  document.querySelectorAll('[data-s]').forEach(a=>{if(a.dataset.s===secao)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');});
  draw();
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
})();
